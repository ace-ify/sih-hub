name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt
      - name: Self-check and validate committed data
        run: |
          python scripts/test_scrape.py
          python scripts/scrape.py --validate

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the site
        working-directory: web
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
