name: refresh

# NOT scheduled on GitHub-hosted runners: sih.gov.in sits behind an Azure
# Application Gateway WAF that returns 403 to GitHub's datacenter IPs. Verified
# 2026-08-24 from a California runner — every path, including the root domain,
# and with full browser headers. So a nightly cron here would fail every night
# and never collect anything.
#
# The scrape has to run from a network the portal accepts. Two ways to use this
# workflow once you have one:
#
#   1. Register a self-hosted runner on a machine the portal serves, then change
#      `runs-on: ubuntu-latest` to `runs-on: self-hosted` and restore the
#      schedule below.
#   2. Leave it dispatch-only and drive the scrape from that machine directly
#      (see "Keeping the data fresh" in the README).
#
# Kept as workflow_dispatch so it stays runnable, and so switching to a
# self-hosted runner is a one-line change rather than a rewrite.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "42 22 * * *"   # 04:12 IST — enable only on a self-hosted runner

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python scripts/test_scrape.py

      # The scraper detects the live SIH edition itself (retired years return
      # HTTP 200 with an empty table, so it checks row counts, not status) and
      # refuses to write when validation fails, leaving committed data intact.
      # Pin an edition with the SIH_YEAR repo variable if the scheme changes.
      - run: python scripts/scrape.py
        env:
          SIH_YEAR: ${{ vars.SIH_YEAR }}

      - name: Commit if the data actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data ps web/src/data; then
            echo "no data changes"
            exit 0
          fi
          git add data ps web/src/data
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push
