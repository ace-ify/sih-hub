name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Root domain vs the PS path
        run: |
          for u in https://sih.gov.in/ https://sih.gov.in/sih2026PS; do
            printf "%-40s " "$u"
            curl -sS -o /dev/null -w "http=%{http_code}\n" --max-time 40 "$u" || echo "exit $?"
          done
      - name: Full browser headers
        run: |
          curl -sS -o /tmp/full.html -w "full-headers http=%{http_code} size=%{size_download}\n" --max-time 60 \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Accept-Encoding: gzip, deflate, br' \
            -H 'Upgrade-Insecure-Requests: 1' \
            -H 'Sec-Fetch-Dest: document' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Site: none' \
            https://sih.gov.in/sih2026PS || echo "exit $?"
          echo "--- what the 403 body says:"
          head -c 400 /tmp/full.html || true
      - name: Which WAF is it
        run: curl -sSI --max-time 40 https://sih.gov.in/sih2026PS | head -20 || true
